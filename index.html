<!DOCTYPE>
<html>
    <head>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div>
            <h3 id="totalText">Total Clicks: 0</h3>
            <button id="shopBtn">MoonShop</button>
            <dialog id="shopDialog">
                <button id="closeShopBtn">Close</button>
                <h1 id="moonCoinShopText">MoonCoins: 0</h1>
                <h5 id="coinsSpentText">MoonCoins Spent in MoonShop: 0</h5>
                <div>
                    <h5 id="markiplierPriceText">Price: 25</h5>
                    <h5 id="markiplierRatioText">Multiplier: 1</h5>
                    <h5 id="markiplierLevelText">Level: 0</h5>
                    <button id="upgradeBtn">Upgrade</button>
                </div>
            </dialog>
            <dialog id="warningDialog">
                <h4 id="warningText">Not enough MoonCoins!</h4>
                <button id="closeWarningBtn">Close</button>
            </dialog>
        </div>
        <button id="moonCakeBtn">🥮</button>
        <h1 id="moonCoinText">MoonCoins: 0</h1>
        <script src="app.js"></script>
    </body>
</html>
